name: 校验与发布

# ┌─ 流程总览 ────────────────────────────────────────────────────────────────┐
# │ push main / 提 PR   ①LF ②语法 ③可复现打包 ④包门禁 ⑤隐私 ⑥冒烟 → 上传产物    │
# │ 打 tag（v*）        先跑上面 ①–⑥，再 ⑦tag↔版本 ⑧打包 ⑨发布/更新 Release    │
# │ 手动触发            填 tag 可补发/重发 Release；勾 selftest 才跑门禁负向测试 │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 默认**跳过**门禁自身的负向测试（自检）；需要时用「Run workflow → selftest」勾选，
# 或在本地跑：python academic-poster-builder/scripts/check_package.py --selftest

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（填了才发布 Release；留空则只校验）'
        required: false
        default: ''
      selftest:
        description: '额外跑门禁自身的负向测试（默认跳过）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ① 校验技能包
    runs-on: ubuntu-latest
    # 字节码写到临时目录，避免源码树里出现 __pycache__（包门禁会判它不合格）
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ① 换行必须是 LF
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          skip = {".zip", ".png", ".jpg", ".jpeg", ".gif", ".ico"}
          bad = [f for f in files
                 if pathlib.Path(f).suffix.lower() not in skip
                 and b"\r\n" in pathlib.Path(f).read_bytes()]
          print("检查 %d 个文件，CRLF: %s" % (len(files), bad or "无"))
          sys.exit(1 if bad else 0)
          PY

      - name: ② Python 语法
        run: python -m compileall -q academic-poster-builder/scripts tools

      - name: ③ 打包两次必须逐字节一致（可复现）
        run: python tools/build_zip.py --reproducible

      - name: ④ 包门禁（目录 + zip）
        run: |
          python academic-poster-builder/scripts/check_package.py academic-poster-builder
          python academic-poster-builder/scripts/check_package.py dist/*.zip

      - name: ⑤ 隐私体检（仓库 + zip 原始字节）
        run: python tools/scan_privacy.py . --zip dist/*.zip

      - name: ⑥ 冒烟：压力矩阵样本登记 + 环境体检脚本
        run: |
          python academic-poster-builder/scripts/60_pressure_matrix.py --list > /dev/null
          python academic-poster-builder/scripts/00_check_env.py || true

      - name: ⑦ 门禁负向测试（自检，默认跳过）
        if: github.event_name == 'workflow_dispatch' && inputs.selftest
        run: python academic-poster-builder/scripts/check_package.py --selftest

      - name: ⑧ 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/*.zip
          if-no-files-found: error

      - name: 汇总
        run: |
          echo "### 校验完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 说明 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ① | 换行 LF |" >> $GITHUB_STEP_SUMMARY
          echo "| ② | Python 语法 |" >> $GITHUB_STEP_SUMMARY
          echo "| ③ | 打包可复现（两次比对 sha256） |" >> $GITHUB_STEP_SUMMARY
          echo "| ④ | 包门禁（目录 + zip） |" >> $GITHUB_STEP_SUMMARY
          echo "| ⑤ | 隐私体检 |" >> $GITHUB_STEP_SUMMARY
          echo "| ⑥ | 冒烟 |" >> $GITHUB_STEP_SUMMARY
          echo "| ⑦ | 门禁负向测试（默认跳过） |" >> $GITHUB_STEP_SUMMARY
          ls -l dist/

  release:
    name: ② 发布 Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - name: 检出代码（tag 指向的提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ① tag 必须与包内 version 一致
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["TAG"]
          ver = re.search(r"^version:\s*([\d.]+)\s*$",
                          pathlib.Path("academic-poster-builder/SKILL.md").read_text(encoding="utf-8"),
                          re.M).group(1)
          print("tag=%s  包内 version=%s" % (tag, ver))
          if tag.lstrip("v") != ver:
              print("::error::tag %s 与包内 version %s 不一致：请先改 SKILL.md 的 version 再打 tag" % (tag, ver))
              sys.exit(1)
          PY

      - name: ② 确定性打包
        run: python tools/build_zip.py

      - name: ③ 发布 / 更新 Release（挂 zip、清过期附件、发布后自检）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip | head -1)
          NAME=$(basename "$ZIP")
          echo "tag=$TAG  zip=$NAME"
          TITLE=$(python -c "import re,pathlib;t=pathlib.Path('academic-poster-builder/SKILL.md').read_text(encoding='utf-8');print(re.search(r'^display_name:\s*(.+)$',t,re.M).group(1).strip())")
          TITLE="${TITLE%%（*}"
          NOTES="RELEASE_NOTES.md"
          if [ ! -f "$NOTES" ]; then echo "::error::缺 $NOTES（Release 描述来源）"; exit 1; fi

          # 已存在就更新，不存在就创建；两种情况都强制 --draft=false
          # （tag 被删过会让 Release 变成 draft/untagged，此时附件对匿名访问不可见）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在 Release：更新标题/描述/取消 draft"
            gh release edit "$TAG" --title "$TITLE $TAG" --notes-file "$NOTES" --draft=false
          else
            echo "创建 Release"
            gh release create "$TAG" --title "$TITLE $TAG" --notes-file "$NOTES" --verify-tag --draft=false
          fi

          gh release upload "$TAG" "$ZIP" --clobber

          # 清理过期附件（附件名带版本号，--clobber 只覆盖同名文件）
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            if [ "$a" != "$NAME" ]; then
              echo "删除过期附件：$a"
              gh release delete-asset "$TAG" "$a" --yes
            fi
          done

          # 发布后自检：附件必须挂上、Release 不能是 draft（否则公开页看不到附件）
          ISDRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
          COUNT=$(gh release view "$TAG" --json assets -q "[.assets[] | select(.name==\"$NAME\")] | length")
          echo "isDraft=$ISDRAFT  附件 $NAME 命中=$COUNT"
          if [ "$ISDRAFT" = "true" ]; then echo "::error::Release 仍是 draft，公开页看不到附件"; exit 1; fi
          if [ "$COUNT" != "1" ]; then echo "::error::附件未挂上：$NAME"; exit 1; fi
          gh release view "$TAG" --json tagName,name,isDraft,assets \
            -q '"tag=\(.tagName)  title=\(.name)  draft=\(.isDraft)  assets=\([.assets[] | "\(.name) (\(.size) B)"] | join(", "))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
