name: 校验与发布

# 推 main / 提 PR → 只校验；打 tag（v*）→ 校验通过后自动创建或更新 Release 并挂上 zip。
# 也可在 Actions 页手动触发（填一个已存在的 tag 即可补发/重发 Release）。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（用它发布 Release；留空则只校验不发布）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 校验技能包
    runs-on: ubuntu-latest
    # 字节码统一写到临时目录，避免在源码树里生成 __pycache__（门禁会把它判为不合格）
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. 换行必须是 LF
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          skip = {".zip", ".png", ".jpg", ".jpeg", ".gif", ".ico"}
          bad = [f for f in files
                 if pathlib.Path(f).suffix.lower() not in skip
                 and b"\r\n" in pathlib.Path(f).read_bytes()]
          print("检查 %d 个文件，CRLF: %s" % (len(files), bad or "无"))
          sys.exit(1 if bad else 0)
          PY

      - name: 2. Python 语法
        run: python -m compileall -q academic-poster-builder/scripts tools

      - name: 3. 打包两次必须逐字节一致（可复现）
        run: python tools/build_zip.py --reproducible

      - name: 4. 包门禁（目录 + zip）
        run: |
          python academic-poster-builder/scripts/check_package.py academic-poster-builder
          python academic-poster-builder/scripts/check_package.py dist/*.zip

      - name: 5. 门禁自身的负向测试（防止门禁退化成空转）
        run: python academic-poster-builder/scripts/check_package.py --selftest

      - name: 6. 隐私体检（仓库 + zip 原始字节）
        run: python tools/scan_privacy.py . --zip dist/*.zip

      - name: 7. 压力矩阵样本登记冒烟（不需要浏览器）
        run: python academic-poster-builder/scripts/60_pressure_matrix.py --list > /dev/null

      - name: 8. 环境体检脚本可运行（缺依赖只报告，不判失败）
        run: python academic-poster-builder/scripts/00_check_env.py || true

      - uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. tag 必须与包内 version 一致
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["TAG"]
          ver = re.search(r"^version:\s*([\d.]+)\s*$",
                          pathlib.Path("academic-poster-builder/SKILL.md").read_text(encoding="utf-8"),
                          re.M).group(1)
          want = tag.lstrip("v")
          print("tag=%s  包内 version=%s" % (tag, ver))
          if want != ver:
              print("::error::tag %s 与包内 version %s 不一致：请先改 SKILL.md 的 version 再打 tag" % (tag, ver))
              sys.exit(1)
          PY

      - name: 2. 打包（确定性）
        run: python tools/build_zip.py

      - name: 3. 发布 / 更新 Release（含附件与过期附件清理）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip | head -1)
          NAME=$(basename "$ZIP")
          echo "tag=$TAG  zip=$NAME"
          TITLE=$(python -c "import re,pathlib;t=pathlib.Path('academic-poster-builder/SKILL.md').read_text(encoding='utf-8');print(re.search(r'^display_name:\s*(.+)$',t,re.M).group(1).strip())")
          TITLE="${TITLE%%（*}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在 Release，更新标题/描述/附件"
            gh release edit "$TAG" --title "$TITLE $TAG" --notes-file RELEASE_NOTES.md
          else
            echo "创建 Release"
            gh release create "$TAG" --title "$TITLE $TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
          gh release upload "$TAG" "$ZIP" --clobber
          # 清理过期附件（附件名带版本号，--clobber 只覆盖同名文件）
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            if [ "$a" != "$NAME" ]; then
              echo "删除过期附件：$a"
              gh release delete-asset "$TAG" "$a" --yes
            fi
          done
          echo "== 发布结果 =="
          gh release view "$TAG" --json tagName,name,assets \
            -q '"tag=\(.tagName)  title=\(.name)  assets=\([.assets[] | "\(.name) (\(.size) B)"] | join(", "))"'
